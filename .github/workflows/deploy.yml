name: Deploy

# A merged PR or a direct push to main both land as a push to main, so this
# single trigger covers both deploy requirements from issue #30.
on:
  push:
    branches: [ main ]

# Never run two deploys at once; let an in-flight deploy finish rather than
# cancelling it half way through.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write # push/pull the image on ghcr.io with GITHUB_TOKEN

    env:
      # Consumed by .kamal/secrets.
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Load deploy SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust the server host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 77.42.86.45 >> ~/.ssh/known_hosts

      - name: Deploy with Kamal
        run: bin/kamal deploy
