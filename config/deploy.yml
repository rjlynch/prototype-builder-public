<%
def env_or(name, fallback)
  value = ENV[name].to_s.strip
  value.empty? ? fallback : value
end

deploy_host = env_or("KAMAL_DEPLOY_HOST", "deploy.example.com")
proxy_host = env_or("KAMAL_PROXY_HOST", "app.example.com")
ssh_user = env_or("KAMAL_SSH_USER", "deploy")
%>

# Name of your application. Used to uniquely configure containers.
service: govuk_prototype_builder

# Name of the container image. On ghcr.io this is <owner>/<name>.
image: rjlynch/govuk_prototype_builder

# Deploy to these servers.
servers:
  web:
    - <%= deploy_host %>

# Enable SSL auto certification via Let's Encrypt.
#
# Using an SSL proxy like this requires turning on config.assume_ssl and
# config.force_ssl in production.rb (both enabled there).
proxy:
  ssl: true
  host: <%= proxy_host %>

# Where you keep your container images.
registry:
  server: ghcr.io
  username: rjlynch
  # Sourced from .kamal/secrets: GITHUB_TOKEN in CI, gh oauth token locally.
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
  clear:
    # Run the Solid Queue Supervisor inside the web server's Puma process.
    SOLID_QUEUE_IN_PUMA: true
    APP_HOST: <%= proxy_host %>
    MAILER_FROM: noreply@<%= proxy_host %>

# Aliases are triggered with "bin/kamal <alias>".
# Database backups to your local machine run via `bin/db-backup` (see README).
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  db: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Persistent storage volume for the sqlite databases and local Active Storage.
volumes:
  - "govuk_prototype_builder_storage:/rails/storage"

# Bridge fingerprinted assets between versions to avoid 404s on in-flight
# requests during a deploy.
asset_path: /rails/public/assets

# Build the image natively for the amd64 server (GitHub runners are amd64).
builder:
  arch: amd64

# Deploy over SSH as the user configured outside the public repository.
ssh:
  user: <%= ssh_user %>
