# Name of your application. Used to uniquely configure containers.
service: govuk_prototype_builder

# Name of the container image. On ghcr.io this is <owner>/<name>.
image: rjlynch/govuk_prototype_builder

# Deploy to these servers.
servers:
  web:
    - 77.42.86.45

# Enable SSL auto certification via Let's Encrypt. The shared kamal-proxy on
# this host terminates TLS and routes by hostname, so multiple apps
# (e.g. workout_tracker) can share ports 80/443.
#
# Using an SSL proxy like this requires turning on config.assume_ssl and
# config.force_ssl in production.rb (both enabled there).
proxy:
  ssl: true
  host: wizard.lynchsoftware.com

# Where you keep your container images.
registry:
  server: ghcr.io
  username: rjlynch
  # Sourced from .kamal/secrets: GITHUB_TOKEN in CI, gh oauth token locally.
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
  clear:
    # Run the Solid Queue Supervisor inside the web server's Puma process.
    SOLID_QUEUE_IN_PUMA: true

# Aliases are triggered with "bin/kamal <alias>".
# Database backups to your local machine run via `bin/db-backup` (see README).
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  db: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Persistent storage volume for the sqlite databases and local Active Storage.
volumes:
  - "govuk_prototype_builder_storage:/rails/storage"

# Bridge fingerprinted assets between versions to avoid 404s on in-flight
# requests during a deploy.
asset_path: /rails/public/assets

# Build the image natively for the amd64 server (GitHub runners are amd64).
builder:
  arch: amd64

# Deploy over SSH as root (matches the existing server setup).
ssh:
  user: root
